repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: unit-tests
        name: unit tests
        entry: .venv/bin/python -m pytest -m "not integration" -x -q
        language: system
        pass_filenames: false
        always_run: true
