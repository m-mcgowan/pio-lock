; Realistic project layout: shared base config + per-env overrides.
; Used to exercise capture/check across multiple envs that share lib_deps
; via extra_configs — and to ensure spec-like strings in comments and
; build_flags are not mistaken for dependencies.

[platformio]
extra_configs = shared/libs.ini

[env]
platform = native
; baseline reference: acme/Lib1 @ ^1.0.0  (this is just a comment)
build_flags = -DREF="acme/Lib1@^1.0.0"

[env:dev]
build_type = debug

[env:prod]
build_type = release
