name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # ── Fast checks (mirrors pre-commit hook) ──────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install ruff mypy

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy pio_lock.py

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install pytest pytest-cov

      - name: Run unit tests
        run: >
          pytest -m "not integration" -v
          --tb=short
          --junitxml=reports/junit.xml
          --cov=pio_lock
          --cov-report=term-missing
          --cov-fail-under=80

      - name: Test summary
        if: always()
        run: |
          {
            echo "## Unit Tests (Python ${{ matrix.python-version }})"
            echo ""
            python3 -c "
          import xml.etree.ElementTree as ET, sys
          try:
              t = ET.parse('reports/junit.xml').getroot().find('testsuite')
              tests, fail, err, skip = t.get('tests','0'), t.get('failures','0'), t.get('errors','0'), t.get('skipped','0')
              passed = int(tests) - int(fail) - int(err) - int(skip)
              icon = ':white_check_mark:' if fail == '0' and err == '0' else ':x:'
              print(f'{icon} **{passed} passed**, {fail} failed, {err} errors, {skip} skipped ({tests} total)')
          except Exception as e:
              print(f':warning: Could not parse test results: {e}')
          "
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: reports/
          retention-days: 30

  # ── Full suite (mirrors pre-push hook on tag pushes) ────────────────────────
  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pio-version:
          - "platformio"            # latest stable
          - "platformio>=6.1,<6.2"  # current major
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO (${{ matrix.pio-version }}) and test dependencies
        run: pip install "${{ matrix.pio-version }}" pytest pytest-cov

      - name: Show PlatformIO version
        run: pio system info

      - name: Run all tests (unit + integration)
        run: >
          pytest -v
          --tb=short
          --junitxml=reports/junit.xml
          --cov=pio_lock
          --cov-report=term-missing
          --cov-report=html:reports/htmlcov
          --cov-fail-under=80

      - name: Test summary
        if: always()
        run: |
          {
            echo "## Integration Tests (PIO: ${{ matrix.pio-version }})"
            echo ""
            python3 -c "
          import xml.etree.ElementTree as ET, sys
          try:
              t = ET.parse('reports/junit.xml').getroot().find('testsuite')
              tests, fail, err, skip = t.get('tests','0'), t.get('failures','0'), t.get('errors','0'), t.get('skipped','0')
              passed = int(tests) - int(fail) - int(err) - int(skip)
              icon = ':white_check_mark:' if fail == '0' and err == '0' else ':x:'
              print(f'{icon} **{passed} passed**, {fail} failed, {err} errors, {skip} skipped ({tests} total)')
          except Exception as e:
              print(f':warning: Could not parse test results: {e}')
          "
            echo ""
            echo "### Coverage"
            echo '```'
            python3 -m coverage report --skip-empty 2>/dev/null || echo "Coverage data not available"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-pio-${{ strategy.job-index }}
          path: reports/
          retention-days: 30
