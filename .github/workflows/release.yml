name: Release

# Tag push (`v*`) automatically builds artifacts and creates a GitHub release.
# Publishing to TestPyPI / PyPI is gated behind a manual workflow_dispatch
# choice — never automatic on tag push. Both publishes use OIDC trusted
# publishing (no API tokens), which requires one-time setup on each index:
#
#   PyPI:     https://pypi.org/manage/account/publishing/
#   TestPyPI: https://test.pypi.org/manage/account/publishing/
#
# Configure with:
#   Owner            = m-mcgowan
#   Project name     = pio-lock
#   Workflow name    = release.yml
#   Environment name = pypi  (or  testpypi)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Where to publish (build-only ignores both indexes)"
        type: choice
        options: [build-only, testpypi, pypi]
        default: build-only

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify pyproject version (and tag match if tagged)
        id: check
        run: |
          ref="${GITHUB_REF}"
          pyproject_version=$(python -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "pyproject version: $pyproject_version"
          if [[ "$ref" == refs/tags/v* ]]; then
            tag_version="${ref#refs/tags/v}"
            if [[ "$tag_version" != "$pyproject_version" ]]; then
              echo "::error::Tag v${tag_version} does not match pyproject.toml version ${pyproject_version}"
              exit 1
            fi
          fi
          echo "version=${pyproject_version}" >> "$GITHUB_OUTPUT"

  test:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: pip install pytest pytest-cov

      - name: Run unit tests
        run: >
          pytest -m "not integration" -v
          --tb=short
          --cov=pio_lock
          --cov-fail-under=80

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify artifacts
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  github-release:
    needs: [verify, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_target == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
